<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Pro – Version ordinateur</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#111827;--mu:#6b7280;--ac:#6d28d9;--bd:#e5e7eb;--ok:#059669;--ko:#dc2626;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mu:#94a3b8;--ac:#a78bfa;--bd:#334155;--ok:#34d399;--ko:#f87171;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,Segoe UI,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap}
h1{font-size:18px;margin:0;flex:1}button,input{font:inherit;border-radius:10px;border:1px solid var(--bd);padding:8px 14px;background:var(--card);color:var(--tx)}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}nav{display:flex;gap:8px;padding:14px 22px}nav button.on{background:var(--ac);color:#fff}
main{padding:0 22px 30px}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}.c b{display:block;font-size:22px;margin-top:4px}.mu{color:var(--mu)}
.t{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:14px}table{border-collapse:collapse;width:100%}th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600}
.bar{display:flex;gap:10px;margin:0 0 12px}.bar input{flex:1}.ko{color:var(--ko)}.ok{color:var(--ok)}#login{max-width:420px;margin:12vh auto;text-align:center}#err{color:var(--ko);padding:0 22px}
.cart{display:grid;grid-template-columns:2fr 1fr;gap:14px}@media(max-width:800px){.cart{grid-template-columns:1fr}}.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-height:60vh;overflow:auto}.pg button{text-align:left}.q{display:flex;gap:8px;align-items:center;margin-bottom:6px}select{font:inherit;border-radius:10px;border:1px solid var(--bd);padding:8px;background:var(--card);color:var(--tx)}dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);max-width:460px;width:92%}dialog label{display:block;margin:8px 0 2px;color:var(--mu)}dialog input,dialog select{width:100%}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:10px 18px;border-radius:12px}
</style></head><body>
<header><h1 id="ttl">Smart Pro</h1><span class="mu" id="who"></span><button id="out" hidden>Déconnexion</button></header>
<div id="login" class="c"><h2>Version ordinateur</h2><p class="mu">Connecte-toi avec le même compte Google que sur le téléphone.</p><button class="p" id="in">Se connecter avec Google</button></div>
<div id="err"></div>
<div id="app" hidden><nav><button data-v="d" class="on">Tableau de bord</button><button data-v="c">Caisse</button><button data-v="p">Produits</button><button data-v="s">Ventes</button></nav><main id="m"></main></div>
<dialog id="dlg"></dialog><div id="toast" hidden></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,collection,onSnapshot,doc,setDoc,updateDoc,deleteDoc,writeBatch,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyDpPKy7GDvzzt81QLJbEdK0irv13RZKgFE",authDomain:"gen-lang-client-0682414334.firebaseapp.com",projectId:"gen-lang-client-0682414334"});
const auth=getAuth(app),db=getFirestore(app,"ai-studio-android-smartsto-3fc22bcb-c797-4859-ae47-fe57bc1f9935");
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fc=n=>new Intl.NumberFormat("fr-FR",{maximumFractionDigits:0}).format(n||0)+" FCFA";
const dt=ms=>ms?new Date(ms).toLocaleString("fr-FR"):"";
let P=[],S=[],V="d",Q="",unsub=[],U=null,C=[];
const err=m=>$("#err").textContent=m||"";
$("#in").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>err("Connexion impossible : "+e.code+(e.code==="auth/unauthorized-domain"?" — ajoute ce domaine dans Firebase > Authentication > Paramètres > Domaines autorisés.":"")));
$("#out").onclick=()=>signOut(auth);
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{V=b.dataset.v;Q="";document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));draw()});
onAuthStateChanged(auth,u=>{unsub.forEach(f=>f());unsub=[];U=u;const on=!!u;$("#login").hidden=on;$("#app").hidden=!on;$("#out").hidden=!on;$("#who").textContent=u?u.email:"";if(!u)return;err("");
const base=["users",u.uid];const lis=(n,fn)=>unsub.push(onSnapshot(collection(db,...base,n),s=>fn(s.docs.map(d=>({id:d.id,...d.data()}))),e=>err("Lecture refusée ("+n+") : "+e.code)));
lis("sync_store_profile",a=>{if(a[0]?.storeName){$("#ttl").textContent=a[0].storeName+" – Smart Pro"}});
lis("sync_products",a=>{P=a;draw()});lis("sync_sales",a=>{S=a.sort((x,y)=>(y.clientCreatedAt||0)-(x.clientCreatedAt||0));draw()})});
function csv(rows,cols,name){const t=[cols.map(c=>c[0]).join(";"),...rows.map(r=>cols.map(c=>'"'+String(r[c[1]]??"").replace(/"/g,'""')+'"').join(";"))].join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+t],{type:"text/csv"}));a.download=name;a.click()}
function tbl(h,rows){return`<div class="t"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.join("")||`<tr><td class="mu">Aucune donnée</td></tr>`}</table></div>`}
function draw(){const m=$("#m"),q=Q.toLowerCase();
if(V==="d"){const ok=S.filter(s=>s.status==="VALIDEE"),low=P.filter(p=>p.status!=="ARCHIVE"&&p.stockQuantity<=p.minThreshold);
m.innerHTML=`<div class="g"><div class="c"><span class="mu">Chiffre d'affaires</span><b>${fc(ok.reduce((a,s)=>a+s.totalAmount,0))}</b></div><div class="c"><span class="mu">Bénéfice</span><b class="ok">${fc(ok.reduce((a,s)=>a+s.profit,0))}</b></div><div class="c"><span class="mu">Ventes validées</span><b>${ok.length}</b></div><div class="c"><span class="mu">Produits</span><b>${P.length}</b></div><div class="c"><span class="mu">Stock bas</span><b class="${low.length?"ko":""}">${low.length}</b></div><div class="c"><span class="mu">Valeur du stock (achat)</span><b>${fc(P.reduce((a,p)=>a+p.purchasePrice*p.stockQuantity,0))}</b></div></div>`;return}
if(V==="c"){pos();return}const isP=V==="p",rows=(isP?P:S).filter(r=>!q||JSON.stringify(Object.values(r)).toLowerCase().includes(q));
m.innerHTML=`<div class="bar"><input id="q" placeholder="Rechercher…" value="${esc(Q)}">${isP?`<button id="np" class="p">+ Produit</button>`:""}<button id="x">Exporter CSV</button></div>`+(isP?tbl(["Produit","Réf.","Catégorie","Achat","Vente","Stock","Statut",""],rows.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.sku)}</td><td>${esc(p.categoryName)}</td><td>${fc(p.purchasePrice)}</td><td>${fc(p.sellingPrice)}</td><td class="${p.stockQuantity<=p.minThreshold?"ko":""}">${p.stockQuantity} ${esc(p.unit)}</td><td>${esc(p.status)}</td><td><button data-e="${p.id}">Modifier</button></td></tr>`)):tbl(["Facture","Date","Client","Caissier","Paiement","Total","Statut",""],rows.map(s=>`<tr><td>${esc(s.invoiceNumber)}</td><td>${dt(s.clientCreatedAt)}</td><td>${esc(s.customerName)}</td><td>${esc(s.cashierName)}</td><td>${esc(s.paymentMethod)}</td><td>${fc(s.totalAmount)}</td><td class="${s.status==="VALIDEE"?"ok":"ko"}">${esc(s.status)}</td><td>${s.status==="VALIDEE"?`<button data-x="${s.id}">Annuler</button>`:""}</td></tr>`)));
const i=$("#q");i.oninput=()=>{Q=i.value;const p=i.selectionStart;draw();const j=$("#q");j.focus();j.setSelectionRange(p,p)};
$("#x").onclick=()=>isP?csv(rows,[["Produit","name"],["Ref","sku"],["Categorie","categoryName"],["Achat","purchasePrice"],["Vente","sellingPrice"],["Stock","stockQuantity"],["Statut","status"]],"produits.csv"):csv(rows,[["Facture","invoiceNumber"],["Client","customerName"],["Caissier","cashierName"],["Paiement","paymentMethod"],["Total","totalAmount"],["Statut","status"]],"ventes.csv");bind()}
const pr=id=>P.find(p=>p.id===id),toast=m=>{const t=$("#toast");t.textContent=m;t.hidden=false;setTimeout(()=>t.hidden=true,3500)};
function sq(){const i=$("#q");i.oninput=()=>{Q=i.value;const p=i.selectionStart;draw();const j=$("#q");j.focus();j.setSelectionRange(p,p)};i.onkeydown=e=>{if(e.key==="Enter"){const p=P.find(x=>x.barcode&&x.barcode===i.value.trim());if(p){add(p.id);Q="";draw()}}}}
function add(id){const l=C.find(x=>x.id===id),p=pr(id);if(l){if(l.n<p.stockQuantity)l.n++}else C.push({id,n:1})}
function pos(){const q=Q.toLowerCase(),list=P.filter(p=>p.status==="ACTIF"&&p.stockQuantity>0&&(!q||(p.name+p.sku+p.barcode).toLowerCase().includes(q))),tot=C.reduce((a,l)=>a+(pr(l.id)?.sellingPrice||0)*l.n,0);
$("#m").innerHTML=`<div class="cart"><div><div class="bar"><input id="q" placeholder="Rechercher ou scanner un code-barres…" value="${esc(Q)}"></div><div class="pg">${list.map(p=>`<button data-a="${p.id}"><b>${esc(p.name)}</b><br><span class="mu">${fc(p.sellingPrice)} · stock ${p.stockQuantity}</span></button>`).join("")||'<span class="mu">Aucun produit</span>'}</div></div><div class="c"><h3 style="margin-top:0">Panier</h3>${C.map((l,i)=>`<div class="q"><span style="flex:1">${esc(pr(l.id)?.name)}</span><button data-m="${i}">−</button>${l.n}<button data-pl="${l.id}">+</button></div>`).join("")||'<p class="mu">Vide</p>'}<p>Total <b>${fc(tot)}</b></p><input id="cu" placeholder="Client (facultatif)" style="width:100%;margin-bottom:8px"><select id="pm" style="width:100%;margin-bottom:8px">${["Espèces","Mobile Money","Orange Money","MTN MoMo","Carte","Virement","Autre"].map(x=>`<option>${x}</option>`).join("")}</select><button class="p" id="ok" style="width:100%" ${C.length?"":"disabled"}>Encaisser</button></div></div>`;
sq();document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{add(b.dataset.a);draw()});document.querySelectorAll("[data-pl]").forEach(b=>b.onclick=()=>{add(b.dataset.pl);draw()});document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const l=C[+b.dataset.m];if(--l.n<1)C.splice(+b.dataset.m,1);draw()});$("#ok").onclick=checkout}
async function checkout(wi=true){const L=C.map(l=>({p:pr(l.id),n:l.n})).filter(l=>l.p);if(!L.length)return;const bad=L.find(l=>l.n>l.p.stockQuantity);if(bad)return toast("Stock insuffisant : "+bad.p.name);
const now=Date.now(),inv="WEB-"+new Date(now).toISOString().replace(/\D/g,"").slice(2,14),t=L.reduce((a,l)=>a+l.p.sellingPrice*l.n,0),profit=L.reduce((a,l)=>a+(l.p.sellingPrice-l.p.purchasePrice)*l.n,0),who=U.displayName||U.email||"PC",cu=$("#cu").value.trim(),pm=$("#pm").value,col=n=>collection(db,"users",U.uid,n),b=writeBatch(db),ts=serverTimestamp();
b.set(doc(col("sync_sales"),"sale_"+inv),{userId:U.uid,invoiceNumber:inv,customerName:cu,cashierName:who,totalAmount:t,profit,paymentMethod:pm,status:"VALIDEE",itemCount:L.reduce((a,l)=>a+l.n,0),clientCreatedAt:now,createdAt:ts,updatedAt:ts,...(wi?{items:L.map(l=>({pid:l.p.id,name:l.p.name,sku:l.p.sku,qty:l.n,price:l.p.sellingPrice,cost:l.p.purchasePrice}))}:{})});
L.forEach(l=>b.update(doc(col("sync_products"),l.p.id),{stockQuantity:l.p.stockQuantity-l.n,clientUpdatedAt:now,updatedAt:ts}));
b.set(doc(col("sync_audit_logs"),"log_"+inv),{userId:U.uid,staffName:who,action:("Vente "+inv+" – "+fc(t)).slice(0,300),module:"Caisse PC",details:L.map(l=>l.n+"× "+l.p.name).join(", ").slice(0,500),createdAt:ts});
try{await b.commit();receipt(inv,now,L,t,cu,pm);C=[];toast("Vente enregistrée");draw()}catch(e){if(wi&&e.code==="permission-denied")return checkout(false);toast("Échec : "+e.code)}}
function receipt(inv,now,L,t,cu,pm){const w=open("","_blank","width=380,height=600");if(!w)return;w.document.write(`<title>${inv}</title><body style="font:14px monospace;width:300px"><h3>${esc($("#ttl").textContent)}</h3>${inv}<br>${dt(now)}<br>${esc(cu)}<hr>${L.map(l=>`${l.n}× ${esc(l.p.name)}<br>&nbsp;&nbsp;${fc(l.p.sellingPrice*l.n)}<br>`).join("")}<hr><b>TOTAL ${fc(t)}</b><br>${esc(pm)}<script>print()<\/script>`);w.document.close()}
function edit(id){const p=id?pr(id):{name:"",sku:"",barcode:"",categoryName:"",purchasePrice:0,sellingPrice:0,stockQuantity:0,minThreshold:0,unit:"Unité",status:"ACTIF"},F=[["name","Nom","text"],["sku","Référence","text"],["barcode","Code-barres","text"],["categoryName","Catégorie","text"],["purchasePrice","Prix d'achat","number"],["sellingPrice","Prix de vente","number"],["stockQuantity","Stock","number"],["minThreshold","Seuil d'alerte","number"],["unit","Unité","text"]],d=$("#dlg");
d.innerHTML=`<h3>${id?"Modifier":"Nouveau"} produit</h3>${F.map(f=>`<label>${f[1]}</label><input id="f_${f[0]}" type="${f[2]}" value="${esc(p[f[0]])}">`).join("")}<label>Statut</label><select id="f_status">${["ACTIF","INACTIF","ARCHIVE"].map(s=>`<option${s===p.status?" selected":""}>${s}</option>`).join("")}</select><div class="bar" style="margin-top:14px"><button class="p" id="sv">Enregistrer</button><button id="cn">Annuler</button>${id?`<button id="dl" class="ko">Supprimer</button>`:""}</div>`;d.showModal();$("#cn").onclick=()=>d.close();
$("#sv").onclick=async()=>{const g=k=>$("#f_"+k).value,n=k=>Math.max(0,Number(g(k))||0),now=Date.now();if(!g("name").trim())return toast("Nom requis");
const o={name:g("name").trim(),sku:g("sku").trim(),barcode:g("barcode").trim(),categoryName:g("categoryName").trim(),purchasePrice:n("purchasePrice"),sellingPrice:n("sellingPrice"),stockQuantity:Math.floor(n("stockQuantity")),minThreshold:Math.floor(n("minThreshold")),unit:g("unit").trim()||"Unité",status:g("status"),clientUpdatedAt:now,updatedAt:serverTimestamp()};
try{const col=collection(db,"users",U.uid,"sync_products");if(id)await updateDoc(doc(col,id),o);else await setDoc(doc(col,"web_"+now),{...o,userId:U.uid,localId:0,createdAt:serverTimestamp()});d.close();toast("Produit enregistré")}catch(e){toast("Échec : "+e.code)}};
if(id)$("#dl").onclick=async()=>{if(confirm("Supprimer ce produit ?")){try{await deleteDoc(doc(db,"users",U.uid,"sync_products",id));d.close()}catch(e){toast("Échec : "+e.code)}}}}
function bind(){$("#np")?.addEventListener("click",()=>edit());document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>edit(b.dataset.e));document.querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{const s=S.find(x=>x.id===b.dataset.x),its=(s?.items||[]).filter(i=>pr(i.pid));if(!confirm(its.length?"Annuler cette vente et remettre les articles en stock ?":"Annuler cette vente ? (Détail des articles absent : le stock ne sera pas remis.)"))return;const bt=writeBatch(db),ts=serverTimestamp(),now=Date.now();bt.update(doc(db,"users",U.uid,"sync_sales",b.dataset.x),{status:"ANNULEE",updatedAt:ts});its.forEach(i=>bt.update(doc(db,"users",U.uid,"sync_products",i.pid),{stockQuantity:pr(i.pid).stockQuantity+i.qty,clientUpdatedAt:now,updatedAt:ts}));try{await bt.commit();toast("Vente annulée")}catch(e){toast("Échec : "+e.code)}})}
draw();
</script></body></html>
